{{- if and .Values.secrets.externalSecret.enabled (not .Values.secrets.existingSecret) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-credentials
  labels: {{- include "algotr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.secrets.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Release.Name }}-credentials
    creationPolicy: Owner
  data:
    {{- range $key, $ref := .Values.secrets.externalSecret.keys }}
    {{- $parts := splitList "#" $ref }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ index $parts 0 }}
        property: {{ index $parts 1 }}
    {{- end }}
{{- end }}
